version: '3.8'

services:
  web:
    build: .
    command: gunicorn journal.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - journal_network
    restart: unless-stopped

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    networks:
      - journal_network
    restart: unless-stopped

  redis:
    image: redis:6
    volumes:
      - redis_data:/data
    networks:
      - journal_network
    restart: unless-stopped

  celery:
    build: .
    command: celery -A journal worker -l INFO
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis
    networks:
      - journal_network
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A journal beat -l INFO
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis
    networks:
      - journal_network
    restart: unless-stopped

  nginx:
    build: ./nginx
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - journal_network
    restart: unless-stopped

networks:
  journal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume: 